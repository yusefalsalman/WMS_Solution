<!doctype html><html lang="en" dir="ltr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WMS Build Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column, a "next step" ticket on top, then phases as aisle cards with collapsible task lists */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#152033; --muted:#5b6678; --line:#d9dee7;
  --accent:#e0a100; --accent-ink:#5a4100; --accent-soft:#fff4d6;
  --done:#1f8a55; --done-soft:#e3f4ea; --doing:#2563c9; --doing-soft:#e3ecfb; --todo:#8a93a3;
  --f-body:"IBM Plex Sans","Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171e29; --ink:#e7ecf3; --muted:#9aa5b6; --line:#2a3443;
  --accent:#f2b72c; --accent-ink:#ffe3a1; --accent-soft:#33280d;
  --done:#46c483; --done-soft:#15301f; --doing:#6ea0ff; --doing-soft:#172640; --todo:#6c7686; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --ink:#e7ecf3; --muted:#9aa5b6; --line:#2a3443;
  --accent:#f2b72c; --accent-ink:#ffe3a1; --accent-soft:#33280d;
  --done:#46c483; --done-soft:#15301f; --doing:#6ea0ff; --doing-soft:#172640; --todo:#6c7686; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding:32px 16px 64px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
code,.mono{font-family:var(--f-mono);font-size:.86em;direction:ltr;unicode-bidi:isolate}
header h1{margin:0;font-size:1.9rem;line-height:1.25;text-wrap:balance;font-weight:700}
header p{margin:4px 0 0;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:8px}
.meter-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-top b{color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:999px}
.ticket{background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.ticket .lbl{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase;direction:ltr;text-align:left}
.ticket h2{margin:0;font-size:1.15rem;color:var(--accent-ink)}
.ticket ol{margin:0;padding-inline-start:22px;color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.phases{display:flex;flex-direction:column;gap:12px}
details.phase{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.phase[data-s="doing"]{border-color:var(--doing)}
summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.code{font-family:var(--f-mono);font-weight:600;font-size:.8rem;padding:4px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);direction:ltr}
.ttl{min-width:0}
.ttl strong{display:block;font-size:1.02rem;line-height:1.4}
.ttl small{color:var(--muted);font-size:.85rem}
.pill{font-size:.78rem;padding:3px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.doing{background:var(--doing-soft);color:var(--doing)}
.pill.todo{background:var(--bg);color:var(--todo);border:1px solid var(--line)}
.body{padding:0 18px 16px;display:flex;flex-direction:column;gap:10px}
.learn{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.tasks li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--todo);margin-top:4px;display:grid;place-items:center;font-size:12px;line-height:1}
li.done .box{background:var(--done);border-color:var(--done);color:var(--surface)}
li.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
li.doing .box{border-color:var(--doing);background:var(--doing-soft)}
.txt{min-width:0}
footer{color:var(--muted);font-size:.85rem;text-align:center}
@media (max-width:520px){summary{grid-template-columns:auto 1fr;}.pill{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>

<div class="wrap" dir="ltr" lang="en">
  <header>
    <h1>Warehouse Management System Roadmap</h1>
    <p>A layered ASP.NET Core Web API on .NET 10, with PostgreSQL, EF Core, and Dapper, plus a React + TypeScript frontend.</p>
  </header>

  <section class="meter" aria-label="Progress">
    <div class="meter-top"><span>Overall progress</span><span id="meterText"></span></div>
    <div class="bar"><i id="meterBar" style="width:0"></i></div>
  </section>

  <section class="ticket" aria-label="Next step">
    <span class="lbl">Next step</span>
    <h2 id="nextTitle"></h2>
    <ol id="nextList"></ol>
  </section>

  <div class="legend">
    <span><i class="dot" style="background:var(--done)"></i>Done</span>
    <span><i class="dot" style="background:var(--doing)"></i>In progress</span>
    <span><i class="dot" style="background:var(--todo)"></i>To do</span>
  </div>

  <div class="phases" id="phases"></div>

  <footer>Last updated: October 27, 2026</footer>
</div>

<script>
const NEXT = {
  title: "Next: Install TanStack Table and build the product screen",
  steps: [
    "Pagination and TanStack Table have been explained. Install @tanstack/react-table, then build the shared application layout and table component.",
    "Connect the product page to getProducts(page, pageSize) with server-side pagination, loading/error/empty states, and product forms restricted to Manager/Admin. Keep filtering and sorting within the scope supported by the API.",
    "Use the product screen to verify an authenticated API request in the browser; finish invalid-login and expiry checks. Session expiry and 401/403 handling have passed simulated checks."
  ]
};

const PHASES = [
 {code:"P00", t:"Project setup", sub:"Solution, Web API, folders, and Git",
  learn:"Solutions vs. projects, dotnet commands, service registration and the request pipeline in Program.cs, top-level statements, reading errors, and Git basics.",
  tasks:[
   ["done","Compare Clean Architecture with layered architecture and choose the layered approach"],
   ["done","Create <code>WMS.slnx</code> and the controller-based <code>WMS.API</code> project inside <code>src/</code>"],
   ["done","Create folders: Controllers, Services, Interfaces, Data, Models/Entities, and Models/DTOs"],
   ["done","Remove WeatherForecast and add <code>AddControllers</code> and <code>MapControllers</code>"],
   ["done","Run the project and open <code>/openapi/v1.json</code>"],
   ["done","Run <code>git init</code>, add <code>.gitignore</code>, and create the first commit"],
   ["done","Commit <code>WMS.slnx</code> and <code>.gitignore</code>, then push the project to GitHub"]
  ]},
 {code:"P01", t:"Entity design", sub:"Product, Warehouse, InventoryItem, StockTransfer, and AuditLog",
  learn:"Class design, encapsulation with private setters and methods, enums, custom exceptions, and business rules inside entities.",
  tasks:[
   ["done","<code>BaseEntity</code>: Id, CreatedAt, and UpdatedAt"],
   ["done","<code>Product</code>: unique SKU, name, unit of measure, and low-stock threshold"],
   ["done","<code>UnitOfMeasure</code> enum with explicit numeric values"],
   ["done","<code>Warehouse</code>: code, name, location, and active status"],
   ["done","<code>InventoryItem</code>: product quantity in a warehouse, with navigation properties"],
   ["done","Encapsulate stock changes in <code>AddStock</code> and <code>RemoveStock</code> to prevent negative balances"],
   ["done","<code>StockTransfer</code>: source, destination, quantity, status, and constructor validation"],
   ["done","<code>TransferStatus</code> enum"],
   ["done","<code>AuditLog</code> and <code>MovementType</code> enum: record inventory changes and their timestamps"],
   ["done","Custom exceptions: <code>DomainException</code> and <code>InsufficientStockException</code>"]
  ]},
 {code:"P02", t:"Database and EF Core", sub:"PostgreSQL, DbContext, and migrations",
  learn:"ORMs, DbContext and DbSet, Fluent API, one-to-many relationships, indexes, unique constraints, migrations, seeding, connection strings, and User Secrets.",
  tasks:[
   ["done","Create a Neon project with development (dev) and production branches"],
   ["done","Install the Npgsql provider, EF Core Design, and the <code>dotnet-ef</code> tool"],
   ["done","Create <code>AppDbContext</code> in Data and register it with dependency injection"],
   ["done","Add separate entity configurations using <code>IEntityTypeConfiguration</code>"],
   ["done","Add unique indexes for SKU, warehouse code, and (WarehouseId, ProductId)"],
   ["done","Store the connection string in User Secrets, outside the repository"],
   ["done","Create and apply the initial migration, then inspect the database tables"],
   ["done","Add a migration to use <code>Restrict</code> instead of <code>Cascade</code> for AuditLog deletes"],
   ["done","Seed two warehouses and sample products using <code>DbSeeder</code>"]
  ]},
 {code:"P03", t:"Complete CRUD workflows", sub:"Products and warehouses, from controllers to the database",
  learn:"DTOs and mapping, interfaces, dependency injection, Scoped/Transient/Singleton service lifetimes, async/await, REST, and HTTP status codes.",
  tasks:[
   ["done","Create request and response DTOs for the entities"],
   ["done","Implement <code>IProductService</code> and <code>ProductService</code>, and register them with DI"],
   ["done","Implement GET, GET by ID, POST, PUT, and DELETE in <code>ProductsController</code>"],
   ["done","Implement the equivalent warehouse endpoints and service"],
   ["done","Serialize enums as strings in JSON"],
   ["done","Set up Swagger UI at <code>/swagger</code> to try the API"],
   ["done","Paginate list responses using <code>PagedResponse&lt;T&gt;</code>"],
   ["done","Use soft deletion instead of permanent deletion"]
  ]},
 {code:"P04", t:"Validation and error handling", sub:"FluentValidation and global exception handling",
  learn:"FluentValidation, middleware, <code>IExceptionHandler</code>, ProblemDetails, and logging with ILogger.",
  tasks:[
   ["done","Validate product and warehouse create/update requests"],
   ["done","Convert exceptions into consistent ProblemDetails responses with a global exception handler"],
   ["done","Return 409 for duplicate SKUs or warehouse codes and for <code>InsufficientStockException</code>"],
   ["done","Log unexpected errors using ILogger"]
  ]},
 {code:"P05", t:"Inventory movements", sub:"Stock receipts, issues, and adjustments with an audit trail",
  learn:"Business logic in services, audit logging for every movement, and EF Core change tracking.",
  tasks:[
   ["done","Add a stock-in endpoint for receiving goods"],
   ["done","Add a stock-out endpoint that prevents negative balances"],
   ["done","Add an inventory adjustment endpoint with a required reason"],
   ["done","Automatically create an AuditLog for each movement"],
   ["done","Display a product's stock across warehouses"]
  ]},
 {code:"P06", t:"Stock transfers with ACID transactions", sub:"Deduct, add, and record together, or roll back everything",
  learn:"ACID, explicit transactions using <code>BeginTransactionAsync</code>, commit and rollback, and the Unit of Work pattern.",
  tasks:[
   ["done","Implement <code>IStockTransferService</code> and <code>StockTransferService</code>"],
   ["done","Deduct source stock, add destination stock, and create the transfer record in one transaction"],
   ["done","Roll back if any step fails, and deliberately test a failure scenario"],
   ["done","Prevent transfers to the same warehouse"],
   ["done","Implement <code>TransfersController</code> and transfer history"]
  ]},
 {code:"P07", t:"Concurrency", sub:"Handle simultaneous transfers of the same stock",
  learn:"Race conditions, optimistic concurrency with PostgreSQL <code>xmin</code>, pessimistic locking using <code>SELECT ... FOR UPDATE</code>, and <code>DbUpdateConcurrencyException</code>.",
  tasks:[
   ["done","Reproduce incorrect balances caused by two concurrent requests"],
   ["done","Configure optimistic concurrency on <code>InventoryItem</code>"],
   ["done","Handle conflicts with a 409 response or a retry"],
   ["done","Use pessimistic locking during transfers and compare the two approaches"]
  ]},
 {code:"P08", t:"Fast reports with Dapper", sub:"Stock summaries, low-stock queries, and audit history",
  learn:"Dapper, hand-written SQL, parameters and SQL injection prevention, and when to use EF Core vs. Dapper.",
  tasks:[
   ["done","Install Dapper and reuse the database connection"],
   ["done","Build a stock report per warehouse with aggregates and GROUP BY"],
   ["done","Query products below their low-stock threshold"],
   ["done","Query the audit log with date and user filters"]
  ]},
 {code:"P09", t:"Authentication and authorization", sub:"JWT and roles",
  learn:"Authentication vs. authorization, password hashing, JWT claims/signing/expiry, and role-based authorization.",
  tasks:[
   ["done","Add the <code>User</code> entity and <code>UserRole</code> enum (Admin, Manager, and Clerk)"],
   ["done","Implement account creation and login with password hashing"],
   ["done","Issue JWTs and validate them through middleware"],
   ["done","Apply <code>[Authorize]</code> and role-based endpoint permissions"],
   ["done","Associate AuditLog records with the current user from the token"]
  ]},
 {code:"P10", t:"Low-stock background job", sub:"Periodic checks and alert generation",
  learn:"We used <code>BackgroundService</code>, which implements <code>IHostedService</code>, and created a scope per cycle to resolve scoped services. <code>Quartz.NET</code> is optional and was not used.",
  tasks:[
   ["done","Run a periodic service that checks products below their low-stock threshold"],
   ["done","Store alerts or replenishment suggestions in a database table"],
   ["done","Expose an endpoint to display alerts"]
  ]},
 {code:"P11", t:"Unit tests", sub:"xUnit and entity business rules",
  learn:"We used Arrange-Act-Assert to test entity rules automatically. StockTransferService was verified manually through Swagger; no automated database integration tests or database mocks were added.",
  tasks:[
   ["done","Create <code>WMS.API.Tests</code> inside <code>tests/</code> and add it to the solution"],
   ["done","Test entity rules: invalid quantities, insufficient stock, same-warehouse transfers, and transfer completion"],
   ["done","Verify <code>StockTransferService</code> manually through Swagger; automated database tests are outside the current scope"],
   ["done","Run <code>dotnet test</code> successfully (8 tests)"]
  ]},
 {code:"P12", t:"Frontend setup", sub:"Vite, React, TypeScript, and Tailwind",
  learn:"React project structure, TypeScript types matching backend DTOs, Axios instances and interceptors, CORS, and environment variables.",
  tasks:[
   ["done","Create a Vite + React + TypeScript project inside <code>client/</code>"],
   ["done","Set up Tailwind CSS"],
   ["done","Configure an Axios instance and the API URL through environment variables"],
   ["done","Attach the JWT with an Axios request interceptor"],
   ["done","Enable CORS in the backend"],
   ["done","Install React Router and configure BrowserRouter"],
   ["done","Protect internal pages with ProtectedRoute and redirect unauthenticated users to /login"]
  ]},
 {code:"P13", t:"Frontend screens", sub:"Login, tables, transfers, and reports",
  learn:"For each screen, define types matching the backend DTOs and API functions, then build the UI. Topics include forms, AuthContext, AuthProvider, state management, data fetching, error handling, and TanStack Table pagination/filtering/sorting.",
  tasks:[
   ["done","Define login types: LoginRequest, LoginResponse, and UserRole"],
   ["done","Implement the login function calling POST /api/auth/login"],
   ["done","Implement AuthContext and AuthProvider for session state, sign-in, and sign-out, and wrap the app in the provider"],
   ["done","Implement useAuth to access the session and sign-in/sign-out functions"],
   ["done","Connect the login form to signIn with loading feedback, duplicate-submit prevention, and error messages"],
   ["done","Design the login screen with a warehouse identity and shared colors, and review desktop and mobile layouts"],
   ["done","Use Tailwind utilities for login and home styling; retain one global stylesheet for theme tokens, base styles, and a custom animation; remove unused template assets"],
   ["done","Display Login at /login and redirect unknown routes to the protected home route"],
   ["done","Navigate to a temporary home screen after login and redirect signed-in users away from /login"],
   ["done","Persist the session in sessionStorage, restore session state and the Axios token after reload, and reject malformed or expired stored sessions"],
   ["done","Add a logout button that clears storage, the Axios token, and React session state, triggering the protected-route redirect"],
   ["done","Clear the session on protected API 401 responses without logging out on 403 or invalid login; expire the session with a timer and focus/visibility checks, and clean up interceptors, timers, and listeners"],
   ["done","Pass 8 simulated checks covering protected 401, 403, invalid-login 401, success, expiry timer, focus, visibility, and cleanup; frontend build and lint pass"],
   ["doing","Browser verification: successful login, reload persistence, and logout confirmed by the user; invalid login, expiry, and authenticated API requests still pending (simulated checks are complete)"],
   ["done","Define request/response types and API functions for products, warehouses, inventory movements, transfers, reports, and active alerts, matching backend routes, pagination, and string enums"],
   ["done","Explain server-side pagination (page/pageSize, replacing the displayed page) and the role of TanStack Table separately from Axios and Tailwind"],
   ["todo","Install TanStack Table and build a reusable table component with server-side pagination for product and warehouse lists"],
   ["todo","Build a responsive shared layout with navigation, user details, logout, and role-aware links and actions"],
   ["todo","Build the product screen: paginated list, create/edit forms, and delete confirmation; restrict write actions to Manager/Admin"],
   ["todo","Build the warehouse screen: paginated list, create/edit forms, active status, and delete confirmation; restrict write actions to Manager/Admin"],
   ["todo","Build the inventory screen with warehouse/product filters, stock-in and stock-out forms, and Manager/Admin stock adjustment"],
   ["todo","Build the stock transfer list and form with product/source/destination selection and clear validation and API error messages"],
   ["todo","Replace the temporary home screen with a dashboard, warehouse stock summaries, low-stock reports, active alerts, and audit-log filters; restrict report/alert requests to Manager/Admin"],
   ["todo","Verify frontend screens in the browser: loading/error/empty states, pagination, role restrictions, forms, and refreshed data after successful operations"]
  ]},
 {code:"P14", t:"Deployment", sub:"Neon, Docker, and backend/frontend hosting",
  learn:"Dockerfiles, production environment variables, server-side migrations, and CORS for the production domain.",
  tasks:[
   ["todo","Set up the database on Neon"],
   ["todo","Create a Dockerfile for the API"],
   ["todo","Deploy the API to Render, Railway, or Azure"],
   ["todo","Deploy the frontend to Vercel or Netlify"],
   ["todo","Verify the complete system online"]
  ]},
 {code:"P15", t:"Documentation and portfolio", sub:"README, screenshots, and project presentation",
  learn:"Project documentation and explaining the project in interviews.",
  tasks:[
   ["todo","Write a README covering the idea, technologies, setup instructions, and screenshots"],
   ["todo","Add a <code>.http</code> file with examples for every endpoint"],
   ["todo","Add the project to the CV and prepare an interview walkthrough"]
  ]}
];

const label = {done:"Done", doing:"In progress", todo:"To do"};
function phaseState(tasks){
  if (tasks.every(t=>t[0]==="done")) return "done";
  if (tasks.some(t=>t[0]!=="todo")) return "doing";
  return "todo";
}
const all = PHASES.flatMap(p=>p.tasks);
const doneN = all.filter(t=>t[0]==="done").length;
const pct = Math.round(doneN/all.length*100);
document.getElementById("meterText").innerHTML = `<b>${doneN}</b> of ${all.length} tasks · ${pct}%`;
requestAnimationFrame(()=>{document.getElementById("meterBar").style.width = pct+"%";});

document.getElementById("nextTitle").textContent = NEXT.title;
document.getElementById("nextList").innerHTML = NEXT.steps.map(s=>`<li>${s}</li>`).join("");

document.getElementById("phases").innerHTML = PHASES.map(p=>{
  const s = phaseState(p.tasks);
  const d = p.tasks.filter(t=>t[0]==="done").length;
  const pill = s==="todo" ? label.todo : `${label[s]} · ${d}/${p.tasks.length}`;
  return `<details class="phase" data-s="${s}" ${s==="doing"?"open":""}>
    <summary><span class="code">${p.code}</span><span class="ttl"><strong>${p.t}</strong><small>${p.sub}</small></span><span class="pill ${s}">${pill}</span></summary>
    <div class="body">
      <ul class="tasks">${p.tasks.map(([st,txt])=>`<li class="${st}"><span class="box" aria-label="${label[st]}">${st==="done"?"✓":""}</span><span class="txt">${txt}</span></li>`).join("")}</ul>
      <div class="learn"><b>Learning topics:</b> ${p.learn}</div>
    </div>
  </details>`;
}).join("");
</script>

</body></html>
